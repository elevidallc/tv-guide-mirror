name: My Channels daily check

on:
  schedule:
    - cron: "30 12 * * *"   # 7:30 AM ET in winter (EST), 8:30 AM in summer (EDT)
  workflow_dispatch:
    inputs:
      free_only:
        description: "Only check the free official links (0 PenguPlay requests)"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: tvgm-main
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Load previous results
        run: |
          git fetch -q origin channel-health || true
          git show origin/channel-health:health.json > health.json 2>/dev/null || echo '{}' > health.json

      - name: Check free links + rotating PenguPlay cards (max 16 PenguPlay requests)
        env:
          PENGU_URL: ${{ secrets.PENGU_URL }}
          SKIP_PENGU: ${{ inputs.free_only && '1' || '0' }}
        run: python my-channels/check.py

      - name: Save new channel IDs
        run: |
          git diff --quiet -- my-channels/catalog && exit 0
          git config user.name "channel-check-bot"
          git config user.email "actions@users.noreply.github.com"
          git add my-channels/catalog
          git commit -q -m "My Channels: update rotated channel IDs ($(date -u +%F))"
          git pull -q --rebase origin main && git push -q origin HEAD:main

      - name: Save results
        run: |
          mkdir /tmp/h && cp health.json /tmp/h/ && cd /tmp/h
          git init -q -b channel-health
          git config user.name "channel-check-bot"
          git config user.email "actions@users.noreply.github.com"
          git add health.json && git commit -q -m "Health $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" channel-health

      - name: Email an alert
        if: hashFiles('alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "My Channels: channel down ($(date -u +%F))" --body-file alert.md
          exit 1
