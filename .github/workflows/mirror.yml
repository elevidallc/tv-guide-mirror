name: Build playlists + guides

on:
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build per-country playlists and merged guides
        run: |
          set -euo pipefail
          rm -rf playlists guides
          python build.py
          ls -la playlists guides
          for f in guides/*.xml; do tail -c 50 "$f" | grep -q "</tv>" || { echo "$f truncated"; exit 1; }; done
      - name: Publish as a single-commit history
        run: |
          set -euo pipefail
          git config user.name "tv-guide-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan rebuilt
          git add -A
          git commit -q -m "Rebuild $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin rebuilt:main
